org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Firebase App Distribution -------------------------------------------------
# Uncomment and fill in, or (preferred for anything you would rather not commit)
# set the matching environment variable, or put the value in local.properties.
# Precedence: environment variable > local.properties > this file.
# Check what is resolved with: ./gradlew deployConfigCheck
#
# Firebase console > Project settings > Your apps > App ID
# env: FIREBASE_APP_ID
#firebaseAppId=1:000000000000:android:0000000000000000000000
#
# Comma-separated tester emails. env: FIREBASE_TESTERS
#firebaseTesters=you@example.com
#
# Comma-separated tester group aliases. env: FIREBASE_GROUPS
#firebaseGroups=
#
# Path to the service account JSON. Normally supplied via the standard
# GOOGLE_APPLICATION_CREDENTIALS environment variable instead of this property.
# env: FIREBASE_SERVICE_ACCOUNT
#firebaseServiceCredentialsFile=secrets/firebase-service-account.json
