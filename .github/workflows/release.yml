name: Release to Firebase App Distribution

# 수동 실행 전용. versionCode 는 version.properties 에 커밋된 값을 그대로 쓴다.
# (CI 가 임의로 올리면 로컬 ./deploy.sh 가 올린 값과 충돌한다. 배포 전에
#  `./gradlew bumpVersionCode` 로 올리고 커밋하는 것이 정해진 순서다.)
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 테스터에게 보여줄 릴리스 노트
        required: false
        default: ''

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 고정 keystore 를 secret 에서 복원한다. 이 키로 서명해야 기존 설치본 위에
      # 덮어쓰기 업데이트가 된다. 로컬과 CI 가 반드시 같은 키를 써야 한다.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CLASSTIME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::CLASSTIME_KEYSTORE_BASE64 secret 이 없습니다."
            echo "로컬에서: base64 -w0 secrets/classtime-release.jks"
            exit 1
          fi
          mkdir -p secrets
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > secrets/classtime-release.jks

      - name: Restore service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret 이 없습니다."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/service-account.json"

      - name: Verify deployment config
        env:
          CLASSTIME_KEYSTORE_FILE: secrets/classtime-release.jks
          CLASSTIME_KEYSTORE_PASSWORD: ${{ secrets.CLASSTIME_KEYSTORE_PASSWORD }}
          CLASSTIME_KEY_ALIAS: ${{ secrets.CLASSTIME_KEY_ALIAS }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: ./gradlew deployConfigCheck

      - name: Build and upload
        env:
          CLASSTIME_KEYSTORE_FILE: secrets/classtime-release.jks
          CLASSTIME_KEYSTORE_PASSWORD: ${{ secrets.CLASSTIME_KEYSTORE_PASSWORD }}
          CLASSTIME_KEY_ALIAS: ${{ secrets.CLASSTIME_KEY_ALIAS }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FIREBASE_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: ./gradlew assembleRelease appDistributionUploadRelease --stacktrace

      # 복원한 비밀 파일은 러너가 폐기되지만, 단계 사이 유출을 줄이려 명시적으로 지운다.
      - name: Scrub secrets
        if: always()
        run: rm -f secrets/classtime-release.jks "$RUNNER_TEMP/service-account.json"
