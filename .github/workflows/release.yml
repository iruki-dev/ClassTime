name: Release to Firebase App Distribution

# 수동 실행 전용. versionCode 는 version.properties 에 커밋된 값을 그대로 쓴다.
# (CI 가 임의로 올리면 로컬 ./deploy.sh 가 올린 값과 충돌한다. 배포 전에
#  `./gradlew bumpVersionCode` 로 올리고 커밋하는 것이 정해진 순서다.)
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 테스터에게 보여줄 릴리스 노트
        required: false
        default: ''

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v3 의 packages 기본값은 'tools platform-tools' 인데, Google 이 레거시 tools
      # 패키지 제공을 중단해 sdkmanager 가 그대로 실패한다. v4 는 기본값에서 tools 를
      # 뺐고, 여기서는 필요한 패키지를 명시해 러너 이미지 구성에 의존하지 않는다.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 고정 keystore 를 secret 에서 복원한다. 이 키로 서명해야 기존 설치본 위에
      # 덮어쓰기 업데이트가 된다. 로컬과 CI 가 반드시 같은 키를 써야 한다.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CLASSTIME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::CLASSTIME_KEYSTORE_BASE64 secret 이 없습니다."
            echo "로컬에서: base64 -w0 secrets/classtime-release.jks"
            exit 1
          fi
          mkdir -p secrets
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > secrets/classtime-release.jks

      # 플러그인(CredentialsRetriever)이 받아들이는 인증은 세 가지다:
      # 서비스 계정 JSON, FIREBASE_TOKEN, 그리고 Firebase CLI 로그인 캐시.
      # 세 번째는 사람이 브라우저로 로그인한 기기에만 있으므로 CI 에서는 쓸 수 없다.
      # 둘 중 등록된 것을 알아서 쓴다.
      - name: Resolve Firebase credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"
            echo "서비스 계정으로 인증합니다."
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN=$FIREBASE_TOKEN" >> "$GITHUB_ENV"
            echo "FIREBASE_TOKEN 으로 인증합니다."
          else
            echo "::error::Firebase 인증 정보가 없습니다. 둘 중 하나를 시크릿으로 등록하세요."
            echo "::error::  FIREBASE_TOKEN                  - 로컬에서 'firebase login:ci' 로 발급"
            echo "::error::  FIREBASE_SERVICE_ACCOUNT_JSON   - 서비스 계정 키 JSON 파일 내용 전체"
            exit 1
          fi

      - name: Verify deployment config
        env:
          CLASSTIME_KEYSTORE_FILE: secrets/classtime-release.jks
          CLASSTIME_KEYSTORE_PASSWORD: ${{ secrets.CLASSTIME_KEYSTORE_PASSWORD }}
          CLASSTIME_KEY_ALIAS: ${{ secrets.CLASSTIME_KEY_ALIAS }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: ./gradlew deployConfigCheck

      - name: Build and upload
        env:
          CLASSTIME_KEYSTORE_FILE: secrets/classtime-release.jks
          CLASSTIME_KEYSTORE_PASSWORD: ${{ secrets.CLASSTIME_KEYSTORE_PASSWORD }}
          CLASSTIME_KEY_ALIAS: ${{ secrets.CLASSTIME_KEY_ALIAS }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FIREBASE_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: ./gradlew assembleRelease appDistributionUploadRelease --stacktrace

      # 복원한 비밀 파일은 러너가 폐기되지만, 단계 사이 유출을 줄이려 명시적으로 지운다.
      - name: Scrub secrets
        if: always()
        run: rm -f secrets/classtime-release.jks "$RUNNER_TEMP/service-account.json"
