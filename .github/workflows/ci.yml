name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 진행 중이던 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # JDK 17 고정. 이 프로젝트의 Gradle 8.9 / AGP 8.5.2 는 JDK 22+ 에서 빌드가 깨진다.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v3 의 packages 기본값은 'tools platform-tools' 인데, Google 이 레거시 tools
      # 패키지 제공을 중단해 sdkmanager 가 그대로 실패한다. v4 는 기본값에서 tools 를
      # 뺐고, 여기서는 필요한 패키지를 명시해 러너 이미지 구성에 의존하지 않는다.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # 서명 키가 없는 환경이므로 debug 만 만든다. 서명된 release 는 release.yml 담당.
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # 실기기 동작이 필요한 계측 테스트. GitHub 러너는 KVM 을 쓸 수 있어
  # 에뮬레이터가 실제로 부팅된다(개발 컨테이너에서는 /dev/kvm 이 없어 실행 불가).
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v3 의 packages 기본값은 'tools platform-tools' 인데, Google 이 레거시 tools
      # 패키지 제공을 중단해 sdkmanager 가 그대로 실패한다. v4 는 기본값에서 tools 를
      # 뺐고, 여기서는 필요한 패키지를 명시해 러너 이미지 구성에 의존하지 않는다.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 러너의 KVM 장치를 일반 사용자도 쓸 수 있게 연다. 이 단계가 없으면
      # 에뮬레이터가 소프트웨어 렌더링으로 떨어져 사실상 부팅되지 않는다.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-results
          path: app/build/reports/androidTests/
          retention-days: 14
